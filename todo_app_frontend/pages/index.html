<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dist/css/main.min.css">
</head>
<body class="app-page">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <div class="brand brand--small">
                <div class="brand__mark">
                    <span class="brand__square brand__square--1"></span>
                    <span class="brand__square brand__square--2"></span>
                    <span class="brand__square brand__square--3"></span>
                </div>
                <span class="brand__name">TaskFlow</span>
            </div>
            <button class="sidebar__close" id="sidebarClose" aria-label="Close menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <nav class="sidebar__nav">
            <a href="#" class="sidebar__nav-item sidebar__nav-item--active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                All tasks
            </a>
            <a href="#" class="sidebar__nav-item" data-filter="In progress">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                In progress
            </a>
            <a href="#" class="sidebar__nav-item" data-filter="Done">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>
                Done
            </a>
            <a href="#" class="sidebar__nav-item" data-filter="Pending">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                Pending
            </a>
        </nav>

        <div class="sidebar__footer">
            <div class="user-info" id="userInfo">
                <div class="user-info__avatar" id="userAvatar">J</div>
                <div class="user-info__details">
                    <span class="user-info__name" id="userName">Loading</span>
                    <span class="user-info__email" id="userEmail"></span>
                </div>
            </div>
            <button class="sidebar__logout" id="logoutBtn" title="Вийти">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="app-main">

        <header class="topbar">
            <button class="topbar__menu-btn" id="menuBtn" aria-label="Меню">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="topbar__search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="topbar__search-input" id="searchInput" placeholder="Find task...">
            </div>
            <div class="topbar__actions">
                <button class="btn btn--primary btn--sm" id="addTaskBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add
                </button>
            </div>
        </header>

        <div class="content">

            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <span class="stat-card__number" id="statTotal">0</span>
                    <span class="stat-card__label">All</span>
                </div>
                <div class="stat-card stat-card--progress">
                    <span class="stat-card__number" id="statProgress">0</span>
                    <span class="stat-card__label">In progress</span>
                </div>
                <div class="stat-card stat-card--done">
                    <span class="stat-card__number" id="statDone">0</span>
                    <span class="stat-card__label">Done</span>
                </div>
                <div class="stat-card stat-card--pending">
                    <span class="stat-card__number" id="statPending">0</span>
                    <span class="stat-card__label">Pending</span>
                </div>
            </div>

            <section class="tasks-section">
                <div class="tasks-section__header">
                    <h2 class="tasks-section__title" id="sectionTitle">All tasks</h2>
                    <div class="tasks-section__sort">
                        <select class="select" id="sortSelect">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                            <option value="az">A-Z</option>
                        </select>
                    </div>
                </div>
                <div class="task-list" id="taskList">
                </div>

                <div class="empty-state" id="emptyState" hidden>
                    <div class="empty-state__icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </div>
                    <p class="empty-state__text">Завдань ще немає.<br>Додайте перше!</p>
                    <button class="btn btn--primary" id="emptyAddBtn">Add task</button>
                </div>

                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                </div>

            </section>
        </div>

    </main>

    <div class="modal-overlay" id="modalOverlay" hidden>
        <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal__header">
                <h2 class="modal__title" id="modalTitle">Нове завдання</h2>
                <button class="modal__close" id="modalClose" aria-label="Закрити">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <form class="task-form" id="taskForm" novalidate>
                <input type="hidden" id="taskId">

                <div class="task-form__field">
                    <label class="task-form__label" for="taskTitle">Назва <span class="required">*</span></label>
                    <input class="task-form__input" type="text" id="taskTitle" placeholder="Що потрібно зробити?" required>
                    <span class="task-form__error" id="taskTitleError"></span>
                </div>

                <div class="task-form__field">
                    <label class="task-form__label" for="taskDescription">Опис</label>
                    <textarea class="task-form__textarea" id="taskDescription" placeholder="Деталі завдання..." rows="3"></textarea>
                </div>

                <div class="task-form__field">
                    <label class="task-form__label" for="taskStatus">Статус</label>
                    <select class="task-form__select" id="taskStatus">
                        <option value="In progress">В процесі</option>
                        <option value="Done">Виконано</option>
                        <option value="Pending">Очікує</option>
                    </select>
                </div>

                <div class="modal__actions">
                    <button type="button" class="btn btn--ghost" id="modalCancelBtn">Скасувати</button>
                    <button type="submit" class="btn btn--primary" id="modalSaveBtn">
                        <span class="btn__text">Зберегти</span>
                        <span class="btn__loader" hidden><span></span><span></span><span></span></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="deleteOverlay" hidden>
        <div class="modal modal--sm" role="dialog" aria-modal="true">
            <div class="modal__header">
                <h2 class="modal__title">Видалити завдання?</h2>
            </div>
            <p class="modal__text">Цю дію не можна скасувати.</p>
            <div class="modal__actions">
                <button class="btn btn--ghost" id="deleteCancelBtn">Скасувати</button>
                <button class="btn btn--danger" id="deleteConfirmBtn">
                    <span class="btn__text">Видалити</span>
                    <span class="btn__loader" hidden><span></span><span></span><span></span></span>
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/dist/js/main.min.js"></script>
</body>
</html>
